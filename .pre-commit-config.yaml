# ADR-0007 section 5.8: Git commits are mandatory validation points.
# Hooks enforce formatting, lint, and type checks before commits.
# Only tools approved by ADR-0007 are used.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.370
    hooks:
      - id: pyright
