# AIOS runtime configuration - Backtesting environment.
# ADR-0009: TOML only, no secrets. Secrets are provided exclusively via environment variables.
# AIOS_ENVIRONMENT must be set to one of: development, testing, backtest, paper, production.

[app]
name = "aios"
environment = "backtest"
debug = false

[database]
host = "localhost"
port = 5432
name = "aios_backtest"
user = "aios"
# password: provide via AIOS_DATABASE_PASSWORD environment variable.

[logging]
level = "INFO"
format = "human"
destination = "console"

[feature_flags]
experimental_features = true

[providers]
# Mock providers enabled for backtesting (AIOS-603 section 6).
# Backtesting environment allows mock providers for deterministic replay.

[[providers.providers]]
type = "mock_market"
enabled = true

[[providers.providers]]
type = "mock_shariah"
enabled = true

[[providers.providers]]
type = "mock_fundamental"
enabled = true

[[providers.providers]]
type = "mock_news"
enabled = true

[ingestion]
# Data ingestion settings for backtesting (AIOS-505, Phase 8)
batch_size = 50
rate_limit_ms = 0
max_concurrent = 2
quarantine_on_warning = false
freshness_max_age_days = 30
default_exchange = "NASDAQ"

[signal]
# Signal Engine thresholds and weights (AIOS-605 section 10, Phase 9.2).
# Bullish bias score >= buy_threshold -> BUY, <= sell_threshold -> SELL, else HOLD.
technical_weight = 0.70
news_weight = 0.30
buy_threshold = 0.65
sell_threshold = 0.35
min_confidence = 0.50
min_news_items = 1
require_news = true

[decision]
# Decision Engine scoring weights and thresholds (AIOS-406 sections 6-7, Phase 9.3).
# Decision Score = Signal*0.60 + Fundamental*0.20 + Market*0.20 on [-1, +1].
# Score >= +0.65 -> BUY, Score <= -0.65 -> SELL, else HOLD.
# Hard Constraints (non-overridable):
#   1. Shariah != COMPLIANT -> NO_TRADE
#   2. Data/Analysis missing -> WAIT
#   3. Risk approval_status = blocked -> NO_TRADE
#   4. Confidence < 0.60 -> WAIT
signal_weight = 0.60
fundamental_weight = 0.20
market_weight = 0.20
buy_threshold = 0.65
sell_threshold = 0.65
min_confidence = 0.60
evidence_completeness_weight = 0.50
component_agreement_weight = 0.30
data_quality_weight = 0.20

[portfolio]
# Portfolio Target Allocation rules (AIOS-206 sections 6, 9, Phase 9.4).
# Allocation Score = Decision*0.50 + Signal*0.25 + Risk*0.25 on [0, 1].
# Hard Constraints (non-overridable):
#   1. Shariah != COMPLIANT -> allocation = 0
#   2. Risk approval_status = blocked -> allocation = 0
#   3. Decision = WAIT/NO_TRADE -> allocation = 0
#   4. Decision = HOLD -> no new allocation
#   5. Risk Limits: max_position_weight, max_sector_exposure
decision_score_weight = 0.50
signal_score_weight = 0.25
risk_score_weight = 0.25
max_position_weight = 0.10
max_portfolio_exposure = 1.0
max_sector_exposure = 0.25
confidence_scaling = true
risk_score_scaling = true
rebalance_threshold = 0.05
min_trade_size = 0.01

[backtest]
# Backtesting Framework configuration (AIOS-707, Phase 9.5).
# All transaction costs, slippage models, and fill policies configurable per ADR-0009.
enabled = true
default_start_date = "2020-01-01"
default_end_date = "2024-12-31"
default_universe = ["AAPL", "MSFT", "NVDA", "JNJ", "V"]
timeframe = "1d"
initial_cash = 100000.0
currency = "USD"
commission_bps = 10.0
spread_bps = 5.0
slippage_model = "fixed"
slippage_bps = 2.0
fill_policy = "next_open"
min_fill_fraction = 0.01
max_position_pct = 10.0
max_sector_pct = 25.0
max_position_weight = 0.10
max_portfolio_exposure = 1.0
max_sector_exposure = 0.25
confidence_scaling = true
risk_score_scaling = true
rebalance_threshold = 0.05
min_trade_size = 0.01
save_equity_curve = true
save_fills = true
save_decisions = true
output_dir = "backtest_results/"
parallel_symbols = false
checkpoint_interval = 100

[strategy_evaluation]
# Strategy Evaluation configuration (Phase 9.6)
risk_free_rate = 0.0
min_trades_for_significance = 30
confidence_level = 0.95
enable_benchmark = true
enable_walk_forward = true
enable_sensitivity = true
enable_robustness = true
enable_monte_carlo = true
enable_regime_analysis = true
enable_statistical_validation = true

[benchmark]
# Benchmark comparison configuration (Phase 9.6)
default_symbol = "SPY"
buy_hold_symbol = "SPY"
custom_portfolio = {}
include_costs = false
rebalance_frequency = "never"

[walk_forward]
# Walk-forward analysis configuration (Phase 9.6)
train_window_days = 252
test_window_days = 63
step_days = 63
mode = "rolling"
min_train_observations = 100
min_test_observations = 20
optimize_parameters = false
parameter_grid = {}

[oos]
# Out-of-sample validation configuration (Phase 9.6)
oos_fraction = 0.3
min_oos_days = 63
strict_temporal_ordering = true
reject_on_overlap = true

[sensitivity]
# Parameter sensitivity analysis configuration (Phase 9.6)
parameter_ranges = {}
max_combinations = 100
optimization_metric = "sharpe_ratio"
deterministic = true

[robustness]
# Robustness testing configuration (Phase 9.6)
commission_multipliers = [1.0, 1.25, 1.5, 2.0]
spread_multipliers = [1.0, 1.5, 2.0, 3.0]
slippage_multipliers = [1.0, 1.5, 2.0, 3.0]
execution_delays = [0, 1, 2, 3]
min_fill_fractions = [0.01, 0.05, 0.1]
max_return_degradation = 0.5
max_drawdown_increase = 0.5

[monte_carlo]
# Monte Carlo simulation configuration (Phase 9.6)
iterations = 10000
seed = 42
confidence_levels = [0.05, 0.25, 0.5, 0.75, 0.95]
drawdown_thresholds = [0.05, 0.10, 0.15, 0.20, 0.25]
shuffle_trades = true
preserve_chronology = false

[statistical_validation]
# Statistical validation configuration (Phase 9.6)
min_trades_for_sharpe = 30
min_trades_for_drawdown = 20
confidence_level = 0.95
sharpe_stability_threshold = 0.5
return_stability_threshold = 0.5

[strategy_scoring]
# Strategy scoring configuration (Phase 9.6)
return_weight = 0.20
risk_weight = 0.20
consistency_weight = 0.15
robustness_weight = 0.15
oos_weight = 0.15
statistical_weight = 0.10
benchmark_weight = 0.05
excellent_threshold = 80.0
good_threshold = 65.0
acceptable_threshold = 50.0

[strategy_classification]
# Strategy classification configuration (Phase 9.6)
fail_threshold = 50.0
weak_threshold = 65.0
acceptable_threshold = 80.0
block_on_oos_failure = true
block_on_severe_drawdown = true
block_on_insufficient_sample = true
block_on_look_ahead = true
block_on_nondeterministic = true
max_drawdown_for_robust = 0.20
[trading]
# Phase 9.6 execution hardening (all controls are enforced on the paper order path).
order_timeout_enabled = true
pending_order_timeout_seconds = 300
order_timeout_scan_interval_seconds = 30

retry_enabled = true
retry_max_attempts = 3
retry_base_delay_ms = 200
retry_max_delay_ms = 2000
retry_backoff_factor = 2.0

market_session_enabled = true
market_timezone = "America/New_York"
market_open = "09:30"
market_close = "16:00"
market_holidays = []

emergency_stop_enabled = true
