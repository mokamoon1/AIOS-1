# Alembic configuration for AIOS (ADR-0006).
# Schema migrations are development/deployment-time operations; Alembic is
# not a runtime layer. The database URL is supplied at runtime through the
# AIOS configuration module (ADR-0009) and is never stored in this file.

[alembic]
script_location = alembic
prepend_sys_path = .
# The sqlalchemy.url value is set programmatically in env.py from
# DatabaseSettings.database_url (ADR-0009 sections 5.6 and 5.7).
sqlalchemy.url =

# Logging configuration for migration runs.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
